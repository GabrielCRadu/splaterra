<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recomandare — Splaterra</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#050506" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Splaterra" />
</head>
<body>
<a class="brand-logo-link" href="/" aria-label="Splaterra - meniu principal"><img class="brand-logo" src="/brand/logo-splaterra.svg" alt="Splaterra" /></a>
<a class="home-link" id="back-to-job-link" href="#">&larr; Inapoi la job</a>
<h1>Recomandare</h1>
<p class="subtitle" id="status">Se incarca...</p>

<div id="content"></div>

<script src="/js/app.js"></script>
<script>
  const jobId = jobIdFromQuery();
  document.getElementById("back-to-job-link").href = `/job.html?id=${jobId}`;

  async function load() {
    try {
      const rec = await apiGet(`/jobs/${jobId}/recommendation`);
      document.getElementById("status").textContent = "";
      const verdictClass = rec.verdict.use_cloud ? "pill-orange" : "pill-green";
      const verdictLabel = rec.verdict.use_cloud ? "Cloud recomandat" : "Local e suficient";
      document.getElementById("content").innerHTML = `
        <div class="card">
          <div class="job-row">
            <div class="job-info">
              <div class="job-name">Verdict</div>
              <div class="job-meta">${escapeHtml(rec.verdict.reason)}</div>
            </div>
            <span class="pill ${verdictClass}">${verdictLabel}</span>
          </div>
        </div>
        <div class="card">
          <div class="job-name" style="margin-bottom:8px;">Extragere cadre</div>
          <div class="job-meta">Fps esantionare: ${rec.extraction.fps}</div>
          <div class="job-meta">Numar cadre finale: ${rec.extraction.num_frames}</div>
          <div class="job-meta">Metoda: ${escapeHtml(rec.extraction.selection_method)}</div>
        </div>
        <div class="card">
          <div class="job-name" style="margin-bottom:8px;">RealityScan</div>
          <div class="job-meta">Downscale: 1/${rec.realityscan.downscale}</div>
          <div class="job-meta">Rolling-shutter correction: ${rec.realityscan.rolling_shutter_correction ? "activ" : "inactiv"}</div>
        </div>
        <div class="card">
          <div class="job-name" style="margin-bottom:8px;">LichtFeld</div>
          <div class="job-meta">Max gaussieni: ${rec.lichtfeld.max_gaussians.toLocaleString("ro-RO")}</div>
          <div class="job-meta">bf16: ${rec.lichtfeld.bf16 ? "activ" : "inactiv"}</div>
        </div>
      `;
    } catch (err) {
      document.getElementById("status").textContent = "Recomandarea nu a fost calculata inca.";
    }
  }

  load();
</script>
</body>
</html>
