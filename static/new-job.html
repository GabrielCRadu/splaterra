<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job nou — Splaterra</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#050506" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Splaterra" />
</head>
<body>
<a class="brand-logo-link" href="/" aria-label="Splaterra - meniu principal"><img class="brand-logo" src="/brand/logo-splaterra.svg" alt="Splaterra" /></a>
<h1>Job nou</h1>
<p class="subtitle">Da-i un nume, apoi adauga clipurile video</p>

<div class="card">
  <input type="text" id="job-name" placeholder="Nume job (ex. Curte interioara)" />
  <label class="settings-label" for="device-type">Dispozitiv</label>
  <select id="device-type">
    <option value="standard">Video normal</option>
    <option value="dji_osmo_360">DJI Osmo 360</option>
    <option value="dji_avata_360">DJI Avata 360</option>
  </select>
  <p class="subtitle" id="device-360-hint" style="display:none; margin:0 0 12px;">
    Clipul trebuie stitch-uit deja in DJI Studio (export echirectangular) inainte sa il incarci
    aici — aplicatia nu proceseaza fisiere .OSV brute.
  </p>
  <button class="btn" id="btn-create">Creeaza job</button>
</div>

<script src="/js/app.js"></script>
<script>
  initCustomSelect(document.getElementById("device-type"));

  document.getElementById("device-type").addEventListener("change", (event) => {
    document.getElementById("device-360-hint").style.display =
      event.target.value === "standard" ? "none" : "block";
  });

  document.getElementById("btn-create").addEventListener("click", async () => {
    const name = document.getElementById("job-name").value.trim();
    if (!name) {
      alert("Introdu un nume pentru job.");
      return;
    }
    const deviceType = document.getElementById("device-type").value;
    const job = await apiPost("/jobs", { name, device_type: deviceType });
    window.location.href = `/job.html?id=${job.id}`;
  });
</script>
</body>
</html>
