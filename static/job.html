<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job — Splat Prep</title>
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<h1 id="job-name">...</h1>
<p class="subtitle" id="job-meta"></p>

<div class="story-bar" id="story-bar"></div>

<div class="story-viewport" id="story-viewport">
  <div class="story-track" id="story-track">

    <div class="story-slide" data-stage="ingestion">
      <div class="story-slide-title">Ingestie</div>
      <div class="story-slide-status" id="slide-status-ingestion"></div>
      <div class="job-meta" style="margin-bottom:8px;">Clipuri video ingerate</div>
      <div id="raw-videos-list"></div>
      <div class="job-meta" style="margin:12px 0 8px;">Adauga clip</div>
      <input type="file" id="add-clip-file-input" accept="video/*" multiple />
      <button class="btn-ghost" id="btn-add-clip-upload" type="button" style="margin-top:8px;">Incarca</button>
      <p class="subtitle" id="add-clip-status" style="margin:8px 0 0;"></p>
      <div id="add-clip-upload-list"></div>
      <button class="btn" id="btn-ingestion-continue" type="button" style="display:none; margin-top:16px;">Continua la extragere cadre</button>
    </div>

    <div class="story-slide" data-stage="frame_extraction">
      <div class="story-slide-title">Extragere cadre</div>
      <div class="story-slide-status" id="slide-status-frame_extraction"></div>
      <p class="subtitle" id="video-info-hint" style="margin:0 0 12px;"></p>
      <label class="settings-label" for="extract-fps">Cadre pe secunda esantionate (fps)</label>
      <input type="text" inputmode="numeric" id="extract-fps" />
      <label class="settings-label" for="extract-method">Metoda de selectie</label>
      <select id="extract-method">
        <option value="best-n">Cele mai clare (best-n)</option>
        <option value="percent">Procent din cadre (cele mai clare, distribuite uniform)</option>
        <option value="batched">Pe loturi (batched)</option>
        <option value="outlier-removal">Elimina cadre neclare (outlier-removal)</option>
      </select>
      <div id="extract-num-frames-row">
        <label class="settings-label" for="extract-num-frames">Numar cadre finale (cele mai clare)</label>
        <input type="text" inputmode="numeric" id="extract-num-frames" />
      </div>
      <div id="extract-percent-row" style="display:none;">
        <label class="settings-label" for="extract-percent">Procent din cadrele esantionate</label>
        <input type="text" inputmode="numeric" id="extract-percent" value="50" />
      </div>
      <p class="subtitle" id="extract-settings-hint" style="margin:8px 0 12px;"></p>
      <p class="subtitle" id="recommend-status" style="margin:0 0 8px;"></p>
      <a class="btn-ghost" id="link-recommendation" style="display:none;">Vezi recomandarea</a>
      <button class="btn-ghost" id="btn-recommend" style="display:none;">Calculeaza recomandare</button>
      <button class="btn" id="btn-extract" style="display:none; margin-top:10px;">Extrage cadre</button>
      <div id="import-frames-panel" style="display:none; margin-top:12px;">
        <div class="job-meta" style="margin-bottom:8px;">Ai deja cadre extrase?</div>
        <input type="text" id="import-frames-path" placeholder="Cale folder (ex. C:\Poze\cadre)" />
        <button class="btn-ghost" id="btn-import-frames" type="button">Foloseste cadrele astea (sari peste extragere)</button>
      </div>
      <a class="btn-ghost" id="link-frames" style="display:none; margin-top:10px;">Revizuieste cadrele</a>
    </div>

    <div class="story-slide" data-stage="alignment">
      <div class="story-slide-title">Alignment</div>
      <div class="story-slide-status" id="slide-status-alignment"></div>
      <button class="btn" id="btn-align" style="display:none;">Porneste alignment</button>
      <a class="btn-ghost" id="link-alignment" style="display:none;">Vezi alignment</a>
    </div>

    <div class="story-slide" data-stage="training">
      <div class="story-slide-title">Antrenare</div>
      <div class="story-slide-status" id="slide-status-training"></div>
      <label class="checkbox-row" for="train-variable-exposure" style="margin-bottom:12px;">
        <input type="checkbox" id="train-variable-exposure" />
        Expunerea/balansul de alb variaza intre cadre (nu e fixat pe camera)
      </label>
      <button class="btn" id="btn-train" style="display:none;">Porneste antrenarea</button>
      <a class="btn-ghost" id="link-training" style="display:none;" download>Descarca splat-ul</a>
    </div>

    <div class="story-slide" data-stage="export">
      <div class="story-slide-title">Export</div>
      <div class="story-slide-status" id="slide-status-export"></div>
      <label class="settings-label" for="export-format">Exporta ca</label>
      <select id="export-format">
        <option value="spz">SPZ (Niantic, ~9x mai mic decat .ply)</option>
        <option value="sog">SOG (SuperSplat, ~18x mai mic decat .ply)</option>
        <option value="ply">PLY (original, fara compresie)</option>
        <option value="html">HTML (viewer de sine statator)</option>
      </select>
      <button class="btn" id="btn-export" type="button" style="margin-top:8px;">Exporta</button>
      <a class="btn-ghost" id="link-export" style="display:none; margin-top:8px;" download>Descarca exportul</a>
    </div>

  </div>
</div>

<div class="story-banner" id="story-banner" style="display:none;"></div>

<div class="card" id="usage-panel" style="display:none; margin-top:12px;">
  <div class="usage-row"><span class="job-meta">CPU</span><span id="usage-cpu">—</span></div>
  <div class="usage-row"><span class="job-meta">RAM</span><span id="usage-ram">—</span></div>
  <div class="usage-row"><span class="job-meta">GPU</span><span id="usage-gpu">—</span></div>
  <div class="usage-row"><span class="job-meta">VRAM</span><span id="usage-vram">—</span></div>
</div>

<script src="/js/app.js"></script>
<script>
  const jobId = jobIdFromQuery();
  const STORIES = ["ingestion", "frame_extraction", "alignment", "training", "export"];
  const STAGE_LABELS = {
    ingestion: "Ingestie",
    frame_extraction: "Extragere cadre",
    alignment: "Alignment",
    recommendation: "Recomandare",
    training: "Antrenare",
    export: "Export",
  };

  let lastStages = [];
  let viewedIndex = 0;
  let reachableIndexCache = 0;
  let initializedView = false;
  let userNavigated = false;
  let videoDurationSeconds = null;
  const lastStatusByStage = {};
  const expandedLogs = new Set();

  function stageStatus(stages, name) {
    const stage = stages.find((s) => s.stage === name);
    return stage ? stage.status : null;
  }

  function reachableIndex(stages) {
    let idx = 0;
    for (const stage of STORIES) {
      if (stageStatus(stages, stage) === "done") {
        idx += 1;
      } else {
        break;
      }
    }
    return Math.min(idx, STORIES.length - 1);
  }

  function progressBarHtml(stage) {
    if (stage.status !== "running") return "";
    if (stage.progress_percent !== null && stage.progress_percent !== undefined) {
      const pct = Math.max(0, Math.min(100, stage.progress_percent));
      return `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    }
    return `<div class="progress-track"><div class="progress-indeterminate"></div></div>`;
  }

  function logPanelHtml(stage) {
    if (!stage.log) return "";
    const isOpen = expandedLogs.has(stage.stage);
    return `
      <button class="btn-ghost log-toggle" type="button" data-stage="${stage.stage}" style="margin-top:8px;">
        ${isOpen ? "Ascunde output CLI" : "Vezi output CLI"}
      </button>
      ${isOpen ? `<pre class="log-output">${escapeHtml(stage.log)}</pre>` : ""}
    `;
  }

  function renderAllSlideStatuses(stages) {
    STORIES.forEach((stageName) => {
      const container = document.getElementById(`slide-status-${stageName}`);
      const s = stages.find((x) => x.stage === stageName);
      if (!s) {
        container.innerHTML = "";
        return;
      }
      const pillClass =
        s.status === "done" ? "pill-green" : s.status === "failed" ? "pill-orange" : "pill-gray";
      const errorLine = s.error ? `<div class="job-meta">${escapeHtml(s.error)}</div>` : "";
      container.innerHTML = `
        <span class="pill ${pillClass}">${s.status}</span>
        ${errorLine}
        ${progressBarHtml(s)}
        ${logPanelHtml(s)}
      `;
    });

    const recommendStage = stages.find((s) => s.stage === "recommendation");
    document.getElementById("recommend-status").textContent =
      recommendStage && recommendStage.status === "failed" ? recommendStage.error || "" : "";
  }

  function renderStoryBar(stages) {
    const bar = document.getElementById("story-bar");
    bar.innerHTML = STORIES.map((stage, i) => {
      const status = stageStatus(stages, stage);
      const activeClass = i === viewedIndex ? " active" : "";
      let fillHtml;
      if (status === "done") {
        fillHtml = `<span class="story-bar-fill" style="width:100%"></span>`;
      } else if (i === viewedIndex && status === "running") {
        const s = stages.find((x) => x.stage === stage);
        if (s && s.progress_percent !== null && s.progress_percent !== undefined) {
          const pct = Math.max(0, Math.min(100, s.progress_percent));
          fillHtml = `<span class="story-bar-fill" style="width:${pct}%"></span>`;
        } else {
          fillHtml = `<span class="story-bar-fill indeterminate"></span>`;
        }
      } else {
        fillHtml = `<span class="story-bar-fill" style="width:0%"></span>`;
      }
      return `
        <button type="button" class="story-bar-segment${activeClass}" data-index="${i}" aria-label="${STAGE_LABELS[stage]}">
          <span class="story-bar-track">${fillHtml}</span>
        </button>
      `;
    }).join("");
  }

  function renderBackgroundBanner(stages) {
    const banner = document.getElementById("story-banner");
    const runningIndex = STORIES.findIndex(
      (stage, i) => i !== viewedIndex && stageStatus(stages, stage) === "running"
    );
    if (runningIndex === -1) {
      banner.style.display = "none";
      return;
    }
    banner.style.display = "flex";
    banner.textContent = `${STAGE_LABELS[STORIES[runningIndex]]} ruleaza in fundal — atinge ca sa vezi`;
    banner.onclick = () => goToSlide(runningIndex, { isUserAction: true });
  }

  function applyTrackTransform() {
    document.getElementById("story-track").style.transform = `translateX(-${viewedIndex * 100}%)`;
  }

  function goToSlide(index, opts) {
    opts = opts || {};
    viewedIndex = Math.max(0, Math.min(index, reachableIndexCache));
    if (opts.isUserAction) {
      userNavigated = viewedIndex !== reachableIndexCache;
    } else if (viewedIndex === reachableIndexCache) {
      userNavigated = false;
    }
    applyTrackTransform();
    renderStoryBar(lastStages);
    renderBackgroundBanner(lastStages);
  }

  function checkAutoAdvance(stages) {
    const currentStage = STORIES[viewedIndex];
    const newStatus = stageStatus(stages, currentStage);
    const prevStatus = lastStatusByStage[currentStage];

    // Ingestion flips to "done" after every single clip upload, not just the
    // last one - auto-advancing here would sweep the user away mid-way
    // through adding a second/third clip. Moving past ingestion is always a
    // manual tap.
    if (
      currentStage !== "ingestion" &&
      prevStatus !== undefined &&
      prevStatus !== "done" &&
      newStatus === "done" &&
      !userNavigated &&
      viewedIndex < STORIES.length - 1
    ) {
      const targetIndex = viewedIndex + 1;
      setTimeout(() => {
        if (!userNavigated) {
          goToSlide(targetIndex, {});
        }
      }, 1200);
    }

    STORIES.forEach((stage) => {
      lastStatusByStage[stage] = stageStatus(stages, stage);
    });
  }

  function renderUsage(usage) {
    document.getElementById("usage-cpu").textContent = `${Math.round(usage.cpu_percent)}%`;
    document.getElementById("usage-ram").textContent =
      `${usage.ram_used_gb.toFixed(1)} / ${usage.ram_total_gb.toFixed(1)} GB`;
    document.getElementById("usage-gpu").textContent =
      usage.gpu_percent === null ? "indisponibil" : `${Math.round(usage.gpu_percent)}%`;
    document.getElementById("usage-vram").textContent =
      usage.vram_used_mb === null
        ? "indisponibil"
        : `${(usage.vram_used_mb / 1024).toFixed(1)} / ${(usage.vram_total_mb / 1024).toFixed(1)} GB`;
  }

  async function loadRawVideos() {
    const { videos } = await apiGet(`/jobs/${jobId}/raw-videos`);
    const list = document.getElementById("raw-videos-list");
    list.innerHTML =
      videos.length === 0
        ? '<p class="job-meta">Niciun clip inca.</p>'
        : videos.map((name) => `<div class="job-meta">${escapeHtml(name)}</div>`).join("");
  }

  function updateActions(stages) {
    const ingestionDone = stageStatus(stages, "ingestion") === "done";
    const extractionDone = stageStatus(stages, "frame_extraction") === "done";
    const alignmentDone = stageStatus(stages, "alignment") === "done";
    const recommendationDone = stageStatus(stages, "recommendation") === "done";
    const trainingDone = stageStatus(stages, "training") === "done";

    document.getElementById("btn-extract").style.display =
      ingestionDone && !extractionDone ? "block" : "none";
    document.getElementById("btn-ingestion-continue").style.display =
      ingestionDone && !extractionDone ? "block" : "none";
    document.getElementById("import-frames-panel").style.display = !extractionDone ? "block" : "none";

    const framesLink = document.getElementById("link-frames");
    framesLink.style.display = extractionDone ? "block" : "none";
    framesLink.href = `/frames.html?id=${jobId}`;

    document.getElementById("btn-align").style.display =
      extractionDone && !alignmentDone ? "block" : "none";

    const alignmentLink = document.getElementById("link-alignment");
    alignmentLink.style.display = alignmentDone ? "block" : "none";
    alignmentLink.href = `/alignment.html?id=${jobId}`;

    document.getElementById("btn-recommend").style.display =
      ingestionDone && !recommendationDone ? "block" : "none";

    const recommendationLink = document.getElementById("link-recommendation");
    recommendationLink.style.display = recommendationDone ? "block" : "none";
    recommendationLink.href = `/recommendation.html?id=${jobId}`;

    document.getElementById("btn-train").style.display =
      alignmentDone && !trainingDone ? "block" : "none";

    const trainingLink = document.getElementById("link-training");
    trainingLink.style.display = trainingDone ? "block" : "none";
    trainingLink.href = `/jobs/${jobId}/training/download`;

    const exportDone = stageStatus(stages, "export") === "done";
    const exportLink = document.getElementById("link-export");
    exportLink.style.display = exportDone ? "block" : "none";
    exportLink.href = `/jobs/${jobId}/export/download`;

    document.getElementById("usage-panel").style.display = stages.some(
      (s) => s.status === "running"
    )
      ? "block"
      : "none";
  }

  function applyStages(stages) {
    lastStages = stages;
    reachableIndexCache = reachableIndex(stages);
    if (!initializedView) {
      viewedIndex = reachableIndexCache;
      initializedView = true;
    }
    checkAutoAdvance(stages);
    renderAllSlideStatuses(stages);
    updateActions(stages);
    renderStoryBar(stages);
    renderBackgroundBanner(stages);
    applyTrackTransform();
  }

  async function refresh() {
    const job = await apiGet(`/jobs/${jobId}`);
    document.getElementById("job-name").textContent = job.name;
    document.getElementById("job-meta").textContent = new Date(job.created_at).toLocaleString("ro-RO");

    const stages = await apiGet(`/jobs/${jobId}/stages`);
    applyStages(stages);
    await loadExtractSettingsDefaults();
    await loadRawVideos();
  }

  function startPolling() {
    return pollStages(jobId, (stages) => {
      applyStages(stages);
      const anyRunning = stages.some((s) => s.status === "running");
      if (stages.length > 0 && !anyRunning) {
        stopPolling();
      }
    });
  }

  const EXTRACT_DEFAULTS = { fps: 10, num_frames: 300, selection_method: "batched" };

  async function loadExtractSettingsDefaults() {
    let extraction = EXTRACT_DEFAULTS;
    let hint = "Valori implicite (recomandarea nu a fost calculata inca).";
    try {
      const rec = await apiGet(`/jobs/${jobId}/recommendation`);
      if (rec.extraction) {
        extraction = rec.extraction;
        hint = "Valori recomandate pe baza duratei video-ului. Le poti modifica.";
      }
    } catch (err) {
      // recommendation not computed yet - keep defaults
    }

    document.getElementById("extract-fps").value = extraction.fps;
    document.getElementById("extract-num-frames").value = extraction.num_frames;
    document.getElementById("extract-method").value = extraction.selection_method;
    extractMethodSelect.sync();
    updateExtractFieldVisibility();
    document.getElementById("extract-settings-hint").textContent = hint;

    const videoInfoHint = document.getElementById("video-info-hint");
    try {
      const info = await apiGet(`/jobs/${jobId}/video-info`);
      videoDurationSeconds = info.duration_seconds;
      videoInfoHint.textContent =
        `Clip: ${info.total_frames} cadre in total, la ${info.fps.toFixed(2)} fps.`;
    } catch (err) {
      videoDurationSeconds = null;
      videoInfoHint.textContent = "";
    }
  }

  function updateExtractFieldVisibility() {
    const method = document.getElementById("extract-method").value;
    document.getElementById("extract-num-frames-row").style.display =
      method === "best-n" ? "block" : "none";
    document.getElementById("extract-percent-row").style.display =
      method === "percent" ? "block" : "none";
  }

  document.getElementById("extract-method").addEventListener("change", updateExtractFieldVisibility);

  document.getElementById("btn-add-clip-upload").addEventListener("click", async () => {
    const files = Array.from(document.getElementById("add-clip-file-input").files);
    const statusEl = document.getElementById("add-clip-status");
    if (files.length === 0) {
      statusEl.textContent = "Alege cel putin un fisier video.";
      return;
    }
    statusEl.textContent = "";

    const listEl = document.getElementById("add-clip-upload-list");
    listEl.innerHTML = "";
    const rows = files.map((file) => {
      const row = document.createElement("div");
      row.className = "upload-row";
      row.innerHTML = `
        <div class="upload-row-name">${escapeHtml(file.name)}</div>
        <div class="progress-track"><div class="progress-fill" style="width:0%"></div></div>
        <div class="upload-row-error"></div>
      `;
      listEl.appendChild(row);
      return row;
    });

    for (let index = 0; index < files.length; index += 1) {
      const fill = rows[index].querySelector(".progress-fill");
      try {
        await uploadFileToJob(jobId, files[index], (done, total) => {
          fill.style.width = `${Math.round((done / total) * 100)}%`;
        });
        rows[index].classList.add("upload-row-done");
      } catch (err) {
        rows[index].classList.add("upload-row-failed");
        rows[index].querySelector(".upload-row-error").textContent = err.message || String(err);
      }
    }

    document.getElementById("add-clip-file-input").value = "";
    refresh();
    stopPolling();
    stopPolling = startPolling();
  });

  document.getElementById("btn-ingestion-continue").addEventListener("click", () => {
    goToSlide(STORIES.indexOf("frame_extraction"), { isUserAction: true });
  });

  document.getElementById("btn-import-frames").addEventListener("click", async () => {
    const sourcePath = document.getElementById("import-frames-path").value.trim();
    if (!sourcePath) {
      alert("Introdu calea folderului cu cadre.");
      return;
    }
    await apiPost(`/jobs/${jobId}/import-frames`, { source_path: sourcePath });
    refresh();
    stopPolling();
    stopPolling = startPolling();
  });

  document.getElementById("btn-extract").addEventListener("click", async () => {
    const fps = parseInt(document.getElementById("extract-fps").value, 10) || EXTRACT_DEFAULTS.fps;
    const rawMethod =
      document.getElementById("extract-method").value || EXTRACT_DEFAULTS.selection_method;

    let selectionMethod = rawMethod;
    let numFrames =
      parseInt(document.getElementById("extract-num-frames").value, 10) || EXTRACT_DEFAULTS.num_frames;

    if (rawMethod === "percent") {
      // sharp-frames has no native "percent" method - "best-n" already picks
      // the sharpest frames first while spreading them roughly evenly (see
      // sharp-frames' select_best_n_frames), so the percentage just needs
      // converting into a concrete frame count using the same total-sampled
      // estimate app/recommendation.py uses (duration * fps).
      const percent = parseFloat(document.getElementById("extract-percent").value) || 50;
      const totalSampled = videoDurationSeconds
        ? Math.round(videoDurationSeconds * fps)
        : EXTRACT_DEFAULTS.num_frames;
      numFrames = Math.max(1, Math.round((totalSampled * percent) / 100));
      selectionMethod = "best-n";
    }

    await apiPost(`/jobs/${jobId}/extract-frames`, {
      fps: fps,
      num_frames: numFrames,
      selection_method: selectionMethod,
    });
    refresh();
    stopPolling();
    stopPolling = startPolling();
  });

  document.getElementById("btn-align").addEventListener("click", async () => {
    await apiPost(`/jobs/${jobId}/align`, {});
    refresh();
    stopPolling();
    stopPolling = startPolling();
  });

  document.getElementById("btn-recommend").addEventListener("click", async () => {
    await apiPost(`/jobs/${jobId}/recommend`, {});
    refresh();
    stopPolling();
    stopPolling = startPolling();
  });

  document.getElementById("btn-train").addEventListener("click", async () => {
    const variableExposure = document.getElementById("train-variable-exposure").checked;
    await apiPost(`/jobs/${jobId}/train`, { variable_exposure: variableExposure });
    refresh();
    stopPolling();
    stopPolling = startPolling();
  });

  document.getElementById("btn-export").addEventListener("click", async () => {
    const format = document.getElementById("export-format").value;
    await apiPost(`/jobs/${jobId}/export`, { format: format });
    refresh();
    stopPolling();
    stopPolling = startPolling();
  });

  document.getElementById("story-track").addEventListener("click", (event) => {
    const toggle = event.target.closest(".log-toggle");
    if (!toggle) return;
    const stageName = toggle.dataset.stage;
    if (expandedLogs.has(stageName)) {
      expandedLogs.delete(stageName);
    } else {
      expandedLogs.add(stageName);
    }
    renderAllSlideStatuses(lastStages);
  });

  document.getElementById("story-bar").addEventListener("click", (event) => {
    const segment = event.target.closest(".story-bar-segment");
    if (!segment) return;
    goToSlide(parseInt(segment.dataset.index, 10), { isUserAction: true });
  });

  document.getElementById("story-viewport").addEventListener("click", (event) => {
    if (event.target.closest("button, a, input, select, .custom-select")) return;
    const rect = event.currentTarget.getBoundingClientRect();
    const tappedPrev = event.clientX - rect.left < rect.width / 3;
    if (tappedPrev) {
      goToSlide(viewedIndex - 1, { isUserAction: true });
    } else {
      goToSlide(viewedIndex + 1, { isUserAction: true });
    }
  });

  const extractMethodSelect = initCustomSelect(document.getElementById("extract-method"));
  initCustomSelect(document.getElementById("export-format"));

  refresh();
  let stopPolling = startPolling();
  pollUsage(renderUsage, 2000);
</script>
</body>
</html>
