<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadre — Splat Prep</title>
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<h1>Cadre extrase</h1>
<p class="subtitle" id="frame-count">Se incarca...</p>

<div class="frame-grid" id="frame-grid"></div>

<script src="/js/app.js"></script>
<script>
  const jobId = jobIdFromQuery();

  async function loadFrames() {
    const { frames } = await apiGet(`/jobs/${jobId}/frames`);
    document.getElementById("frame-count").textContent =
      frames.length === 0 ? "Niciun cadru inca" : `${frames.length} cadre`;

    const grid = document.getElementById("frame-grid");
    grid.innerHTML = frames
      .map(
        (name) =>
          `<div class="frame-cell"><img src="/jobs/${jobId}/frames/${encodeURIComponent(name)}" loading="lazy" /></div>`
      )
      .join("");
  }

  loadFrames();
</script>
</body>
</html>
