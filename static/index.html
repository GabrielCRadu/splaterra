<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Splat Prep</title>
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<h1>Job-uri</h1>
<p class="subtitle" id="job-count">Se incarca...</p>

<div id="job-list"></div>

<a class="btn" href="/new-job.html">+ Job nou</a>

<button class="done-button" id="done-button" style="display:none;">Gata</button>
<div class="trash-target" id="trash-target" style="display:none;" aria-label="Trage aici ca sa stergi">&#128465;&#65039;</div>

<div class="modal-overlay" id="delete-modal" style="display:none;">
  <div class="modal-card">
    <div class="modal-title">Stergi job-ul?</div>
    <div class="modal-body" id="delete-modal-text"></div>
    <div class="modal-actions">
      <button class="btn-danger" id="confirm-delete-btn">Sterge</button>
      <button class="btn-ghost" id="cancel-delete-btn">Anuleaza</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const STAGE_LABELS = {
    ingestion: "Ingestie",
    frame_extraction: "Extragere cadre",
    alignment: "Alignment",
    recommendation: "Recomandare",
  };

  function stagePill(stages) {
    if (stages.length === 0) {
      return '<span class="pill pill-gray">Nou</span>';
    }
    const failed = stages.find((s) => s.status === "failed");
    if (failed) {
      return `<span class="pill pill-orange">${STAGE_LABELS[failed.stage] || failed.stage} esuat</span>`;
    }
    const running = stages.find((s) => s.status === "running");
    if (running) {
      return `<span class="pill pill-green">${STAGE_LABELS[running.stage] || running.stage}...</span>`;
    }
    return '<span class="pill pill-gray">Gata</span>';
  }

  async function loadJobs() {
    const jobs = await apiGet("/jobs");
    document.getElementById("job-count").textContent =
      jobs.length === 0 ? "Niciun job inca" : `${jobs.length} job-uri`;

    const list = document.getElementById("job-list");
    if (jobs.length === 0) {
      list.innerHTML = '<p class="empty">Apasa "+ Job nou" ca sa incepi.</p>';
      return;
    }

    const rows = await Promise.all(
      jobs.map(async (job) => {
        const stages = await apiGet(`/jobs/${job.id}/stages`);
        return `
          <div class="job-list-row" data-job-id="${job.id}" data-job-name="${escapeHtml(job.name)}">
            <a class="job-row" href="/job.html?id=${job.id}" draggable="false">
              <div class="job-thumb">&#127916;</div>
              <div class="job-info">
                <div class="job-name">${escapeHtml(job.name)}</div>
                <div class="job-meta">${new Date(job.created_at).toLocaleString("ro-RO")}</div>
              </div>
              ${stagePill(stages)}
            </a>
          </div>
        `;
      })
    );
    list.innerHTML = `<div class="card" style="padding:0;">${rows.join("")}</div>`;

    list.querySelectorAll(".job-list-row").forEach((row) => {
      attachRowGestures(row, row.dataset.jobId, row.dataset.jobName);
      if (jiggleMode) row.classList.add("jiggle-mode");
    });
  }

  // --- Press-and-hold -> jiggle -> drag-to-trash deletion ---

  let jiggleMode = false;
  let longPressTimer = null;
  let dragOffsetX = 0;
  let dragOffsetY = 0;

  const LONG_PRESS_MS = 500;
  const MOVE_CANCEL_PX = 10;

  function enterJiggleMode() {
    jiggleMode = true;
    document.querySelectorAll(".job-list-row").forEach((row) => row.classList.add("jiggle-mode"));
    document.getElementById("done-button").style.display = "block";
    document.getElementById("trash-target").style.display = "flex";
  }

  function exitJiggleMode() {
    jiggleMode = false;
    document.querySelectorAll(".job-list-row").forEach((row) => row.classList.remove("jiggle-mode"));
    document.getElementById("done-button").style.display = "none";
    document.getElementById("trash-target").style.display = "none";
  }

  function isOverTrash(x, y) {
    const rect = document.getElementById("trash-target").getBoundingClientRect();
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }

  function attachRowGestures(row, jobId, jobName) {
    // Prevent the browser's native long-press context menu (Open in new tab,
    // Copy link, etc.) from appearing over the link during our own
    // press-and-hold gesture - this fires on Android Chrome; iOS Safari's
    // equivalent link callout is suppressed via -webkit-touch-callout in CSS.
    row.addEventListener("contextmenu", (event) => event.preventDefault());

    row.addEventListener("pointerdown", (event) => {
      if (event.button !== undefined && event.button !== 0) return;

      const startX = event.clientX;
      const startY = event.clientY;
      const rowRect = row.getBoundingClientRect();
      dragOffsetX = startX - rowRect.left;
      dragOffsetY = startY - rowRect.top;

      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        if (!jiggleMode) enterJiggleMode();
        startDragging(row, jobId, jobName, rowRect, startX, startY);
      }, LONG_PRESS_MS);

      const cancelIfMoved = (moveEvent) => {
        if (
          longPressTimer &&
          (Math.abs(moveEvent.clientX - startX) > MOVE_CANCEL_PX ||
            Math.abs(moveEvent.clientY - startY) > MOVE_CANCEL_PX)
        ) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      };
      const clearOnUp = () => {
        document.removeEventListener("pointermove", cancelIfMoved);
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      };
      document.addEventListener("pointermove", cancelIfMoved);
      document.addEventListener("pointerup", clearOnUp, { once: true });
    });

    row.addEventListener("click", (event) => {
      if (jiggleMode) event.preventDefault();
    });
  }

  function startDragging(row, jobId, jobName, originalRect, startX, startY) {
    row.classList.add("dragging");
    row.classList.remove("jiggle-mode");
    row.style.width = originalRect.width + "px";
    row.style.left = startX - dragOffsetX + "px";
    row.style.top = startY - dragOffsetY + "px";

    function onMove(event) {
      row.style.left = event.clientX - dragOffsetX + "px";
      row.style.top = event.clientY - dragOffsetY + "px";
      document
        .getElementById("trash-target")
        .classList.toggle("armed", isOverTrash(event.clientX, event.clientY));
    }

    function onUp(event) {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.getElementById("trash-target").classList.remove("armed");

      row.classList.remove("dragging");
      row.style.position = "";
      row.style.left = "";
      row.style.top = "";
      row.style.width = "";
      if (jiggleMode) row.classList.add("jiggle-mode");

      if (isOverTrash(event.clientX, event.clientY)) {
        showDeleteModal(jobId, jobName);
      }
    }

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  }

  document.getElementById("done-button").addEventListener("click", exitJiggleMode);

  // --- Delete confirmation modal (reused by the drag-to-trash gesture above) ---

  let jobIdPendingDelete = null;

  function showDeleteModal(jobId, jobName) {
    jobIdPendingDelete = jobId;
    document.getElementById("delete-modal-text").textContent =
      `"${jobName}" si toate fisierele lui (video, cadre, rezultate) vor fi sterse definitiv. Nu se poate anula.`;
    document.getElementById("delete-modal").style.display = "flex";
  }

  function hideDeleteModal() {
    jobIdPendingDelete = null;
    document.getElementById("delete-modal").style.display = "none";
  }

  document.getElementById("cancel-delete-btn").addEventListener("click", hideDeleteModal);

  document.getElementById("confirm-delete-btn").addEventListener("click", async () => {
    const jobId = jobIdPendingDelete;
    if (!jobId) return;
    hideDeleteModal();

    const response = await fetch(`/jobs/${jobId}`, { method: "DELETE" });
    if (!response.ok && response.status !== 404) {
      alert(
        response.status === 409
          ? "Job-ul are o etapa in curs de rulare - asteapta sa se termine inainte sa il stergi."
          : "Nu am putut sterge job-ul."
      );
    }
    loadJobs();
  });

  loadJobs();
</script>
</body>
</html>
